stages:
- test

verify_on_runner:
  stage: test
  image: python:3.12-slim
  when: manual
  allow_failure: true
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
  script:
    - python -m ruff check welfare_*.py welfare_search tests
    - python -m pytest -q
